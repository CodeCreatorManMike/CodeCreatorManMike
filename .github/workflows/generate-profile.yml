name: generate-profile

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: generate-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install native deps for node-canvas
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev build-essential

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node scripts/github-data.mjs

      - name: Render profile.gif
        run: node scripts/render-combined.mjs

      - name: Update README.md
        run: node scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated data.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: regenerate profile [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                exit 0
              fi
              echo "Push rejected (attempt $i), rebasing onto latest main and retrying..."
              git fetch origin main
              git rebase origin/main
            done
            echo "Push failed after retries."
            exit 1
          else
            echo "No changes to commit."
          fi
